[project]
name = "viralai"
version = "0.1.0"
description = "ViralAI: an AI-powered, modular, virus-agnostic viral genomics research and simulation platform."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [
    { name = "ViralAI Project" }
]
keywords = ["viral genomics", "AI", "bioinformatics", "research", "mutation hotspot", "protein structure"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
]

dependencies = [
    "pydantic>=2.6",
    "diskcache>=5.6",
    "networkx>=3.2",
    "numpy>=1.26",
    "scikit-learn>=1.4",
    "shap>=0.45",
    # SHAP's optional acceleration stack must stay compatible with the supported
    # Python runtimes. Without these lower bounds the previous lockfile selected
    # Numba 0.53 / llvmlite 0.36, which cannot install on Python 3.11+.
    "numba>=0.66",
    "llvmlite>=0.48",
    "matplotlib>=3.8",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "httpx>=0.27",
    "python-multipart>=0.0.6",
    "cryptography>=42",
]

[project.urls]
Homepage = "https://example.com/viralai"
Repository = "https://github.com/viralai/viralai"
Documentation = "https://example.com/viralai/docs"
"Bug Tracker" = "https://github.com/viralai/viralai/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "black>=24.0",
]

[project.scripts]
viralai = "viralai.cli:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests", "plugins"]
pythonpath = ["src"]
markers = [
    "unit: fast, isolated tests of a single function/class (Ch.32.3)",
    "integration: tests exercising communication between two or more engines (Ch.32.3)",
    "system: end-to-end capstone tests exercising the complete platform (Ch.32.3)",
    "plugin: tests specific to a plugin package's own correctness (Ch.32.3)",
    "performance: tests asserting timing/throughput bounds, not just correctness (Ch.32.3)",
    "benchmark: tests run as part of the Benchmark Repository suite (Ch.33)",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.black]
line-length = 100
target-version = ["py311"]
