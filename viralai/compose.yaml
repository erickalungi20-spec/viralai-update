services:
  api:
    build:
      context: .
    image: viralai:local
    environment:
      VIRALAI_ENVIRONMENT: production
      VIRALAI_DATA_DIR: /var/lib/viralai
      VIRALAI_PLUGINS_DIR: /app/plugins
      VIRALAI_ENCRYPTION_KEY: ${VIRALAI_ENCRYPTION_KEY:?Set VIRALAI_ENCRYPTION_KEY in .env}
    ports:
      - "${VIRALAI_PORT:-8000}:8000"
    volumes:
      - viralai-data:/var/lib/viralai
    read_only: true
    tmpfs:
      - /tmp
    restart: unless-stopped
    healthcheck:
      test:
        ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/ready')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  viralai-data:
