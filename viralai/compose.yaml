services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: viralai:local
    environment:
      VIRALAI_ENVIRONMENT: production
      VIRALAI_DATA_DIR: /var/lib/viralai
      VIRALAI_PLUGINS_DIR: /app/plugins
      VIRALAI_ENCRYPTION_KEY: ${VIRALAI_ENCRYPTION_KEY:?Set VIRALAI_ENCRYPTION_KEY in .env}
    ports:
      - "${VIRALAI_PORT:-8000}:8000"
    volumes:
      - viralai-data:/var/lib/viralai
    read_only: false
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; import sys; r=urlopen('http://127.0.0.1:8000/ready', timeout=5); print(r.read().decode()); sys.exit(0 if r.status==200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 25s

volumes:
  viralai-data:
